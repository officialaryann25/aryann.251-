  <line x1="84" y1="138" x2="84" y2="160" stroke="#6B3820" stroke-width="1" opacity="0.4"/>
  <line x1="96" y1="138" x2="96" y2="160" stroke="#6B3820" stroke-width="1" opacity="0.4"/>
  <line x1="108" y1="138" x2="108" y2="160" stroke="#6B3820" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="138" x2="120" y2="160" stroke="#6B3820" stroke-width="1" opacity="0.4"/>
