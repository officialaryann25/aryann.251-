<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <radialGradient id="bghg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="100%" stop-color="#FFF8EF"/>
    </radialGradient>
    <radialGradient id="cup1g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE0E9"/>
      <stop offset="50%" stop-color="#fff8fc"/>
      <stop offset="100%" stop-color="#FFE0E9"/>
    </radialGradient>
    <radialGradient id="cup2g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4F5EA"/>
      <stop offset="50%" stop-color="#f0fffb"/>
      <stop offset="100%" stop-color="#D4F5EA"/>
    </radialGradient>
    <radialGradient id="cup3g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="50%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#FFF3D0"/>
    </radialGradient>
    <filter id="glShadow">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#6B3820" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="400" height="500" fill="url(#bghg)" rx="24"/>
  <!-- dots -->
  <circle cx="40"  cy="60"  r="11" fill="#E8486A" opacity="0.15"/>
  <circle cx="362" cy="95"  r="15" fill="#2AA87A" opacity="0.12"/>
  <circle cx="28"  cy="430" r="9"  fill="#D48C0F" opacity="0.14"/>
  <circle cx="375" cy="370" r="8"  fill="#E8486A" opacity="0.12"/>
  <circle cx="70"  cy="310" r="5"  fill="#2AA87A" opacity="0.18"/>
  <circle cx="330" cy="210" r="6"  fill="#D48C0F" opacity="0.14"/>

  <!-- surface / marble slab -->
  <rect x="30" y="360" width="340" height="20" rx="6" fill="#EDD4B0" stroke="#A0714D" stroke-width="1"/>

  <!-- ── CUP 1 (left, strawberry) ── -->
  <path d="M62,360 L78,255 L142,255 L158,360 Z" fill="url(#cup1g)" stroke="#FFE0E9" stroke-width="1.5" filter="url(#glShadow)"/>
  <!-- cup rim -->
  <ellipse cx="110" cy="255" rx="36" ry="10" fill="#C43057" opacity="0.4" stroke="#E8486A" stroke-width="1"/>
  <!-- label stripe -->
  <rect x="68" y="305" width="84" height="22" rx="0" fill="#E8486A" opacity="0.18"/>
  <!-- strawberry gelato mound -->
  <ellipse cx="110" cy="252" rx="38" ry="16" fill="#E8486A" stroke="#C43057" stroke-width="1.5"/>
  <ellipse cx="98"  cy="236" rx="28" ry="24" fill="#FFE0E9" stroke="#E8486A" stroke-width="1.5"/>
  <ellipse cx="124" cy="234" rx="24" ry="22" fill="#E8486A"  stroke="#C43057" stroke-width="1"/>
  <!-- spoon -->
  <rect x="140" y="212" width="6" height="54" rx="3" fill="#EDD4B0" transform="rotate(18 143 238)"/>
  <!-- seed dots -->
  <circle cx="100" cy="242" r="2.5" fill="#C43057" opacity="0.55"/>
  <circle cx="118" cy="238" r="2" fill="#C43057" opacity="0.45"/>
  <circle cx="108" cy="230" r="2" fill="#C43057" opacity="0.40"/>

  <!-- ── CUP 2 (center, mint) larger ── -->
  <path d="M152,360 L170,230 L230,230 L248,360 Z" fill="url(#cup2g)" stroke="#D4F5EA" stroke-width="1.5" filter="url(#glShadow)"/>
  <ellipse cx="200" cy="230" rx="42" ry="12" fill="#1E8A63" opacity="0.35" stroke="#2AA87A" stroke-width="1"/>
  <rect x="160" y="278" width="80" height="24" rx="0" fill="#2AA87A" opacity="0.18"/>
  <!-- mint gelato -->
  <ellipse cx="200" cy="226" rx="44" ry="18" fill="#2AA87A" stroke="#1E8A63" stroke-width="1.5"/>
  <ellipse cx="186" cy="208" rx="32" ry="28" fill="#D4F5EA" stroke="#2AA87A" stroke-width="1.5"/>
  <ellipse cx="216" cy="205" rx="28" ry="26" fill="#52C49D" stroke="#2AA87A" stroke-width="1"/>
  <circle  cx="200" cy="188" r="14" fill="#D4F5EA" stroke="#2AA87A" stroke-width="1"/>
  <!-- mint leaf on top -->
  <path d="M200,176 Q212,162 222,172 Q212,182 200,176 Z" fill="#2AA87A"/>
  <path d="M200,176 Q188,162 178,172 Q188,182 200,176 Z" fill="#1E8A63" opacity="0.7"/>
  <!-- spoon -->
  <rect x="232" y="188" width="6" height="56" rx="3" fill="#EDD4B0" transform="rotate(15 235 216)"/>

  <!-- ── CUP 3 (right, caramel) ── -->
  <path d="M242,360 L258,255 L322,255 L338,360 Z" fill="url(#cup3g)" stroke="#FFF3D0" stroke-width="1.5" filter="url(#glShadow)"/>
  <ellipse cx="290" cy="255" rx="36" ry="10" fill="#D48C0F" opacity="0.4" stroke="#D48C0F" stroke-width="1"/>
  <rect x="248" y="305" width="84" height="22" rx="0" fill="#D48C0F" opacity="0.18"/>
  <!-- caramel gelato -->
  <ellipse cx="290" cy="252" rx="38" ry="16" fill="#D48C0F" stroke="#6B3820" stroke-width="1.5"/>
  <ellipse cx="278" cy="236" rx="28" ry="24" fill="#FFF3D0" stroke="#D48C0F" stroke-width="1.5"/>
  <ellipse cx="304" cy="234" rx="24" ry="22" fill="#F0C060" stroke="#D48C0F" stroke-width="1"/>
  <!-- caramel drizzle -->
  <path d="M272,240 Q280,256 274,268" fill="none" stroke="#6B3820" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- spoon -->
  <rect x="318" y="214" width="6" height="52" rx="3" fill="#EDD4B0" transform="rotate(-18 321 240)"/>

  <!-- background waffle cone leaning -->
  <polygon points="200,470 170,320 230,320" fill="#D48C0F" stroke="#6B3820" stroke-width="1.5" opacity="0.55"/>
  <line x1="178" y1="320" x2="188" y2="470" stroke="#6B3820" stroke-width="1" opacity="0.2"/>
  <line x1="190" y1="320" x2="200" y2="470" stroke="#6B3820" stroke-width="1" opacity="0.2"/>
  <line x1="210" y1="320" x2="200" y2="470" stroke="#6B3820" stroke-width="1" opacity="0.2"/>
</svg>