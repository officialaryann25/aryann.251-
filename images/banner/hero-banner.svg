<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bgb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1c02"/>
      <stop offset="40%" stop-color="#7b3f00"/>
      <stop offset="100%" stop-color="#c17f35"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,179,198,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,179,198,0)"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#bgb)"/>
  <!-- Decorative circles -->
  <circle cx="1400" cy="100" r="300" fill="rgba(255,203,164,0.12)"/>
  <circle cx="100"  cy="700" r="250" fill="rgba(255,179,198,0.10)"/>
  <circle cx="800"  cy="400" r="500" fill="rgba(255,255,255,0.04)"/>
  <circle cx="400"  cy="200" r="150" fill="rgba(255,220,150,0.08)"/>
  <circle cx="1200" cy="600" r="200" fill="rgba(193,127,53,0.15)"/>
  <!-- Ice cream emojis scattered -->
  <text x="160"  y="420" font-size="200" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.5">🍦</text>
  <text x="480"  y="480" font-size="170" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.45">🍨</text>
  <text x="820"  y="460" font-size="190" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.5">🍧</text>
  <text x="1160" y="440" font-size="175" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.45">🍫</text>
  <text x="1400" y="480" font-size="160" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.4">🍓</text>
  <!-- Smaller floating -->
  <text x="80"   y="180" font-size="80" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.3">🌟</text>
  <text x="750"  y="180" font-size="70" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.3">✨</text>
  <text x="1500" y="200" font-size="75" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.25">🍪</text>
  <text x="300"  y="700" font-size="65" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.25">🥭</text>
  <text x="1050" y="720" font-size="70" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.25">🌈</text>
  <!-- Top shine -->
  <rect x="0" y="0" width="1600" height="300" fill="url(#glow1)"/>
</svg>