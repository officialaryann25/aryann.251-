<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#F5DEB3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <circle cx="1450" cy="80"  r="220" fill="#D4A853" opacity="0.15"/>
  <circle cx="80"   cy="420" r="180" fill="#D4A853" opacity="0.12"/>
  <circle cx="800"  cy="250" r="350" fill="rgba(255,255,255,0.04)"/>
  <text x="200"  y="300" font-size="200" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.45">🍦</text>
  <text x="680"  y="320" font-size="180" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.40">🍓</text>
  <text x="1150" y="310" font-size="190" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.42">🍫</text>
  <text x="50"   y="150" font-size="80"  font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.25">✨</text>
  <text x="1500" y="200" font-size="70"  font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" opacity="0.22">🌟</text>
  <rect x="0" y="0" width="1600" height="200" fill="url(#shine)"/>
