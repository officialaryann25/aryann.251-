<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
  <radialGradient id="bgG" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#FFF8EF"/>
    <stop offset="100%" stop-color="#FDE8CC"/>
  </radialGradient>
  
</defs>

  <rect width="200" height="200" rx="20" fill="url(#bgG)"/>
  <!-- cup -->
  <path d="M75,165 L80,95 L120,95 L125,165 Z" fill="#FFE0E9" stroke="#E8486A" stroke-width="1.5"/>
