  <!-- lid -->
  <ellipse cx="100" cy="95" rx="22" ry="7" fill="#E8486A" stroke="#C43057" stroke-width="1.5"/>
  <!-- whipped cream -->
  <path d="M85,95 Q88,80 100,75 Q112,80 115,95" fill="#fff" stroke="#EDD4B0" stroke-width="1"/>
  <circle cx="100" cy="72" r="8" fill="#fff"/>
  <!-- straw -->
  <rect x="108" y="55" width="6" height="60" rx="3" fill="#E8486A" opacity="0.8"/>
  <rect x="110" y="55" width="2" height="60" rx="1" fill="#FFE0E9"/>
  <!-- bubbles on cup -->
  <circle cx="88" cy="120" r="4" fill="#E8486A" opacity="0.25"/>
  <circle cx="112" cy="135" r="3" fill="#E8486A" opacity="0.2"/>
  <circle cx="95" cy="145" r="3.5" fill="#E8486A" opacity="0.2"/>
</svg>