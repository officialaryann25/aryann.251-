<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <radialGradient id="bghs" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#D4F5EA"/>
      <stop offset="100%" stop-color="#F0FFF9"/>
    </radialGradient>
    <filter id="sShadow">
      <feDropShadow dx="2" dy="6" stdDeviation="10" flood-color="#6B3820" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="400" height="500" fill="url(#bghs)" rx="24"/>
  <!-- decorative dots -->
  <circle cx="38"  cy="65"  r="12" fill="#2AA87A" opacity="0.2"/>
  <circle cx="364" cy="88"  r="16" fill="#E8486A" opacity="0.12"/>
  <circle cx="25"  cy="425" r="9"  fill="#D48C0F" opacity="0.14"/>
  <circle cx="375" cy="360" r="10" fill="#2AA87A" opacity="0.12"/>

  <!-- large leaf garnish group -->
  <ellipse cx="80" cy="150" rx="42" ry="20" fill="#2AA87A" transform="rotate(-35 80 150)" opacity="0.7"/>
  <ellipse cx="320" cy="165" rx="38" ry="18" fill="#1E8A63" transform="rotate(30 320 165)" opacity="0.6"/>
  <ellipse cx="200" cy="440" rx="50" ry="18" fill="#2AA87A" opacity="0.25"/>

  <!-- wooden tray / board -->
  <rect x="50" y="358" width="300" height="28" rx="10" fill="#D48C0F" stroke="#6B3820" stroke-width="1.5" opacity="0.65"/>
  <line x1="50" y1="368" x2="350" y2="368" stroke="#6B3820" stroke-width="0.8" opacity="0.3"/>

  <!-- scoop 1 – watermelon / red -->
  <circle cx="112" cy="318" r="54" fill="#F44336" stroke="#C62828" stroke-width="2" filter="url(#sShadow)"/>
  <circle cx="112" cy="318" r="46" fill="#EF5350" opacity="0.4"/>
  <!-- seeds -->
  <ellipse cx="98"  cy="315" rx="5" ry="8" fill="#3A1A08" opacity="0.55" transform="rotate(-10 98 315)"/>
  <ellipse cx="118" cy="308" rx="4" ry="7" fill="#3A1A08" opacity="0.5" transform="rotate(8 118 308)"/>
  <ellipse cx="128" cy="326" rx="4" ry="7" fill="#3A1A08" opacity="0.45" transform="rotate(-15 128 326)"/>
  <!-- shine -->
  <ellipse cx="97" cy="300" rx="12" ry="8" fill="#fff" opacity="0.22"/>

  <!-- scoop 2 – mango / orange -->
  <circle cx="200" cy="305" r="58" fill="#FF8F00" stroke="#E65100" stroke-width="2" filter="url(#sShadow)"/>
  <circle cx="200" cy="305" r="50" fill="#FFA726" opacity="0.4"/>
  <path d="M182,288 Q200,275 218,285" fill="none" stroke="#FFCA28" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- shine -->
  <ellipse cx="182" cy="290" rx="14" ry="9" fill="#fff" opacity="0.2"/>

  <!-- scoop 3 – lemon / yellow -->
  <circle cx="288" cy="318" r="52" fill="#FDD835" stroke="#F9A825" stroke-width="2" filter="url(#sShadow)"/>
  <circle cx="288" cy="318" r="44" fill="#FFEE58" opacity="0.35"/>
  <!-- zest texture -->
  <circle cx="278" cy="313" r="3" fill="#F9A825" opacity="0.45"/>
  <circle cx="296" cy="308" r="2.5" fill="#F9A825" opacity="0.4"/>
  <circle cx="300" cy="324" r="3" fill="#F9A825" opacity="0.35"/>
  <!-- shine -->
  <ellipse cx="272" cy="305" rx="11" ry="7" fill="#fff" opacity="0.22"/>

  <!-- extra mini scoop behind – raspberry -->
  <circle cx="160" cy="295" r="34" fill="#E8486A" stroke="#C43057" stroke-width="1.5" opacity="0.85" filter="url(#sShadow)"/>
  <ellipse cx="150" cy="285" rx="8" ry="5" fill="#fff" opacity="0.2"/>

  <!-- mint leaf garnish on mango -->
  <path d="M200,250 Q216,234 228,244 Q216,258 200,250 Z" fill="#2AA87A"/>
  <path d="M200,250 Q184,234 172,244 Q184,258 200,250 Z" fill="#1E8A63" opacity="0.8"/>

  <!-- powdered sugar dots -->
  <circle cx="130" cy="268" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="175" cy="258" r="3" fill="#fff" opacity="0.55"/>
  <circle cx="226" cy="256" r="4" fill="#fff" opacity="0.5"/>
  <circle cx="268" cy="270" r="3" fill="#fff" opacity="0.55"/>

  <!-- spoon -->
  <rect x="314" y="300" width="8" height="68" rx="4" fill="#FFF8EF" stroke="#EDD4B0" stroke-width="1" transform="rotate(-22 318 334)"/>
  <ellipse cx="307" cy="296" rx="12" ry="8" fill="#FFF8EF" stroke="#EDD4B0" stroke-width="1" transform="rotate(-22 307 296)"/>
</svg>