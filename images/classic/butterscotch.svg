<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgbutter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <linearGradient id="shinebutter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgbutter)" rx="0"/>
  <!-- Decorative blobs -->
  <circle cx="360" cy="40" r="80" fill="#FFB300" opacity="0.18"/>
  <circle cx="40" cy="270" r="60" fill="#FFB300" opacity="0.15"/>
  <circle cx="200" cy="290" r="45" fill="#FFB300" opacity="0.10"/>
  <circle cx="10" cy="10" r="50" fill="rgba(255,255,255,0.08)"/>
  <!-- Dot pattern -->
  <circle cx="80" cy="60" r="4" fill="rgba(255,255,255,0.3)"/>
  <circle cx="130" cy="40" r="3" fill="rgba(255,255,255,0.25)"/>
  <circle cx="320" cy="80" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="280" cy="260" r="4" fill="rgba(255,255,255,0.25)"/>
  <circle cx="340" cy="230" r="3" fill="rgba(255,255,255,0.2)"/>
  <!-- Main emoji -->
  <text x="200" y="158" font-size="115" text-anchor="middle" dominant-baseline="middle"
        font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">🧈</text>
  <!-- Top shine overlay -->
  <rect x="0" y="0" width="400" height="120" fill="url(#shinebutter)"/>
</svg>